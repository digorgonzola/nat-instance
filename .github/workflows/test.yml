name: Tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Run Lambda unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Keep in step with the Lambda runtime in lambda.tf.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  terratest:
    name: Run Terratest tests
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TERRATEST_TERRAFORM_BINARY: tofu
      # Shared by all test inits; the tests take turns to init, so this is safe.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
      # The tests init temporary copies with no lock file, which otherwise bypass the cache.
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: 1.13.2
          tofu_wrapper: false

      - name: Create plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # -short skips the integration tests, which need AWS credentials and an existing VPC.
      - name: Run Terratest unit tests
        working-directory: tests
        run: go test -v -short -timeout 15m -parallel 4 ./...
